name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --name py-assettocorsa-recorder main.py
      - run: gh release upload ${{ github.event.release.tag_name }} dist/py-assettocorsa-recorder.exe
        env:
          GH_TOKEN: ${{ github.token }}
